---
- name: Install application runtime and service manager
  ansible.builtin.apt:
    name: [openjdk-17-jre-headless, supervisor]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_directory }}"
    state: directory
    mode: '0755'

- name: Copy executable artifact
  ansible.builtin.copy:
    src: "{{ artifact_source }}"
    dest: "{{ app_directory }}/app.jar"
    mode: '0644'
  notify: Restart inventory service

- name: Configure managed inventory service
  ansible.builtin.template:
    src: inventory.conf.j2
    dest: /etc/supervisor/conf.d/inventory.conf
    mode: '0644'
  notify: Restart inventory service

- name: Apply pending service configuration
  ansible.builtin.meta: flush_handlers

- name: Check managed application process
  ansible.builtin.command: supervisorctl status inventory
  register: inventory_service
  changed_when: false
  failed_when: "'RUNNING' not in inventory_service.stdout"
  until: "'RUNNING' in inventory_service.stdout"
  retries: 10
  delay: 1

- name: Verify healthy HTTP response
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}/health"
    status_code: 200
  register: health_check
  until: health_check.status == 200
  retries: 20
  delay: 2
