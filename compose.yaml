name: mini-inventory-lab
services:
  jenkins:
    build: ./infra/jenkins
    ports: ["127.0.0.1:18081:8080"]
    environment:
      JAVA_OPTS: -Xms128m -Xmx512m -Djenkins.install.runSetupWizard=false
    mem_limit: 1g
    volumes:
      - jenkins-data:/var/jenkins_home
      - ./infra/jenkins/bootstrap.groovy:/var/jenkins_home/init.groovy.d/bootstrap.groovy:ro
      - ./.secrets/jenkins-admin-password:/run/secrets/jenkins-admin-password:ro
    profiles: [ci]
  inventory-target:
    build:
      context: .
      dockerfile: infra/ansible-target/Dockerfile
    volumes: ["./.secrets:/keys:ro"]
    ports: ["127.0.0.1:8082:8080"]
    mem_limit: 384m
    profiles: [ansible]
  ansible:
    build: ./infra/ansible-controller
    volumes: ["./:/workspace:ro", "./.secrets:/keys:ro"]
    mem_limit: 384m
    profiles: [ansible]
    command: ["-i", "inventory.ini", "playbook.yml"]
  maven:
    image: maven:3.9-eclipse-temurin-17
    working_dir: /workspace
    volumes: ["./:/workspace", "maven-data:/root/.m2"]
    environment:
      MAVEN_OPTS: -Xmx256m
    mem_limit: 512m
    profiles: [build]
    command: ["mvn", "-B", "-ntp", "clean", "verify"]
volumes:
  jenkins-data:
  maven-data:
